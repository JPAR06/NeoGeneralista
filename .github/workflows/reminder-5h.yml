name: Reminder 5h antes do evento

on:
  schedule:
    # Every hour, on the hour (UTC). Endpoint's 4-6h window ensures every
    # confirmed reservation gets exactly one reminder.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/send-reminders-5h
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SITE_URL or CRON_SECRET secret" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/send-reminders-5h"
